name: customer-management-demo

services:
  backend:
    image: customer-management-backend:demo
    platform: linux/amd64
    pull_policy: never
    ports:
      - "127.0.0.1:${DEMO_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12

  frontend:
    image: customer-management-frontend:demo
    platform: linux/amd64
    pull_policy: never
    ports:
      - "127.0.0.1:${DEMO_UI_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy